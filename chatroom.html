<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff69b4">
  <title>Chatroom | The Comic Relief Corner</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="load.js"></script>
  <script type="module" src="chat.js"></script>
  <style>
    .chatroom-page { width: min(100% - 32px, 780px); margin: 0 auto 32px; padding-top: 100px; }
    .chatroom-heading { margin-bottom: 12px; }
    .chatroom-heading h1 { margin: 0 0 5px; font-size: clamp(1.55rem, 3vw, 2rem); }
    .chatroom-heading p { margin: 0; opacity: .8; font-size: .92rem; }
    .chat-container { box-sizing: border-box; width: 100%; max-width: 780px; min-height: 0; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 11px; border-radius: 16px; background: var(--card-bg, #1f121b); border: 1px solid rgba(255,105,180,.28); box-shadow: 0 8px 28px rgba(0,0,0,.2); }
    .chat-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .chat-header h2 { margin: 0; font-size: 1.1rem; }
    .chat-status { font-size: .8rem; opacity: .75; }
    .messages-window { min-height: 180px; height: 36vh; max-height: 360px; overflow-y: auto; display: flex; flex-direction: column; gap: 9px; padding: 12px; border-radius: 12px; background: rgba(0,0,0,.2); border: 1px solid rgba(255,105,180,.15); }
    .chat-bubble { overflow-wrap: anywhere; padding: 8px 10px; border-radius: 10px; background: rgba(255,105,180,.08); line-height: 1.4; }
    .chat-meta { font-weight: 700; margin-right: 6px; }
    .chat-timestamp { display: block; margin-top: 3px; font-size: .72rem; opacity: .65; }
    .chat-input-bar { display: flex; gap: 8px; width: 100%; }
    .chat-input { box-sizing: border-box; min-width: 0; flex: 1; padding: 10px 12px; border-radius: 10px; color: inherit; background: rgba(0,0,0,.2); border: 1px solid rgba(255,105,180,.35); font: inherit; }
    .chat-input:focus { outline: 2px solid rgba(255,105,180,.35); outline-offset: 1px; }
    .chat-send-btn { padding: 9px 14px; border: 1px solid #ff69b4; border-radius: 10px; background: #ff69b4; color: #24101c; font: inherit; font-weight: 700; cursor: pointer; }
    .chat-send-btn:hover { filter: brightness(1.08); }
    .chat-secondary-btn { background: transparent; color: inherit; }
    #auth-container { max-width: 440px; margin-top: 18px; }
    #auth-form { display: flex; flex-direction: column; gap: 9px; }
    .auth-actions { display: flex; gap: 8px; }
    .auth-actions button { flex: 1; }
    #auth-error { margin: 0; color: #ff6b6b; overflow-wrap: anywhere; }
    .chat-empty { margin: auto; padding: 20px 10px; text-align: center; opacity: .7; }
    .profile-settings { border: 1px solid rgba(255,105,180,.2); border-radius: 10px; padding: 9px 11px; }
    .profile-settings summary { cursor: pointer; font-weight: 700; font-size: .9rem; }
    .profile-controls { display: flex; align-items: end; flex-wrap: wrap; gap: 9px; padding-top: 12px; }
    .profile-field { display: flex; flex: 1 1 150px; min-width: 0; flex-direction: column; gap: 5px; font-size: .85rem; }
    .profile-field input[type="text"] { width: 100%; }
    .profile-field input[type="color"] { width: 48px; height: 40px; padding: 2px; border: 1px solid rgba(255,105,180,.35); border-radius: 8px; background: transparent; cursor: pointer; }
    .profile-note { font-size: .78rem; opacity: .7; margin: 8px 0 0; }
    .delete-account-btn { border-color: #e45b69; color: #ff9aa3; }
    #profile-status { font-size: .82rem; margin: 8px 0 0; }
    @media (max-width: 560px) {
      .chatroom-page { width: min(100% - 20px, 780px); margin-top: 0; padding-top: 92px; }
      .chat-container { padding: 12px; gap: 9px; }
      .messages-window { height: 34vh; min-height: 160px; padding: 9px; }
      .chat-input-bar { gap: 6px; }
      .chat-send-btn { padding: 9px 11px; }
    }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>
  <div id="header-container"></div>

  <main class="main chatroom-page">
    <header class="chatroom-heading">
      <h1>Chatroom</h1>
      <p>Talk with the Comic Relief Corner community.</p>
    </header>

    <section id="auth-container" class="chat-container" aria-labelledby="auth-title">
      <div class="chat-header"><h2 id="auth-title">Welcome to the chatroom</h2></div>
      <p style="margin:0;opacity:.8;font-size:.9rem">Log in or create an account to join the conversation.</p>
      <form id="auth-form">
        <label for="auth-username">Username (for new accounts)</label>
        <input type="text" id="auth-username" class="chat-input" placeholder="Choose a username" maxlength="24" autocomplete="nickname">
        <label for="auth-email">Email address</label>
        <input type="email" id="auth-email" class="chat-input" placeholder="you@example.com" autocomplete="email" required>
        <label for="auth-password">Password</label>
        <input type="password" id="auth-password" class="chat-input" placeholder="At least 6 characters" minlength="6" autocomplete="current-password" required>
        <div class="auth-actions">
          <button type="submit" id="login-btn" class="chat-send-btn">Log in</button>
          <button type="button" id="signup-btn" class="chat-send-btn chat-secondary-btn">Create account</button>
        </div>
        <p id="auth-error" role="alert" hidden></p>
      </form>
    </section>

    <section id="secure-chat-container" class="chat-container" style="display:none" aria-label="Community chat">
      <div class="chat-header">
        <div><h2>Community chat</h2><span class="chat-status">Messages from the community</span></div>
        <button type="button" id="logout-btn" class="chat-send-btn chat-secondary-btn">Log out</button>
      </div>

      <details class="profile-settings">
        <summary>Username &amp; appearance</summary>
        <div class="profile-controls">
          <label class="profile-field" for="profile-username">Username
            <input type="text" id="profile-username" class="chat-input" maxlength="24" autocomplete="nickname" required>
          </label>
          <label class="profile-field" for="profile-color">Name color
            <input type="color" id="profile-color" value="#ff69b4" aria-label="Choose the color of your username">
          </label>
          <button type="button" id="save-profile-btn" class="chat-send-btn">Save</button>
        </div>
        <p id="profile-status" role="status" aria-live="polite"></p>
        <p class="profile-note">Your chosen name and color will appear on messages you send next.</p>
      </details>
      <div style="display:flex;justify-content:flex-end">
        <button type="button" id="delete-account-btn" class="chat-send-btn chat-secondary-btn delete-account-btn">Delete my account</button>
      </div>

      <div class="messages-window" id="chat-window" aria-live="polite" aria-label="Chat messages">
        <p class="chat-empty">Loading messages…</p>
      </div>
      <form class="chat-input-bar" id="chat-form">
        <input type="text" id="chat-msg" class="chat-input" placeholder="Write a message…" maxlength="1000" autocomplete="off" required aria-label="Your message">
        <button type="submit" class="chat-send-btn">Send</button>
      </form>
    </section>
  </main>
</body>
</html>
