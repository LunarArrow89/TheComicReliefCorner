<!-- Inject this right where you want the live chatbox component inside your site container -->
<div class="chat-container">
    <div class="chat-header">
        <h2>Live Transmission</h2>
    </div>
    <div class="messages-window" id="chat-window">
        <!-- Messages stream in here automatically -->
    </div>
    <form class="chat-input-bar" id="chat-form">
        <input type="text" id="chat-msg" class="chat-input" placeholder="Type a transmission..." autocomplete="off" required>
        <button type="submit" class="chat-send-btn">SEND</button>
    </form>
</div>

<!-- Load Supabase Core Framework from CDN -->
<script src="https://jsdelivr.net"></script>
<script src="chat.js"></script>
