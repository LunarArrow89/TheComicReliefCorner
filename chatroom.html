<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Transmission - TheComicReliefCorner</title>
    
    <!-- 1. LINK YOUR WEB SITE'S CSS RULES FILE (Make sure this filename matches your repository css file) -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Include Supabase Core Framework from CDN -->
    <script src="https://jsdelivr.net"></script>
    
    <style>
        /* Extra custom styling to center your chat box layout perfectly inside your main workspace area */
        .chat-container {
            display: flex;
            flex-direction: column;
            background: #1f121b; /* Matches your core UI panel background */
            border: 1px solid rgba(255, 105, 180, 0.25); /* System signature pink glow frame */
            border-radius: 20px;
            padding: 25px;
            box-sizing: border-box;
            height: 550px;
            width: 100%;
            max-width: 700px;
            margin: 40px auto 0 auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), 0 0 15px rgba(255, 105, 180, 0.1);
        }

        .chat-header h2 {
            margin-top: 0;
            margin-bottom: 15px;
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            text-shadow: 0 0 3px #ff69b4, 0 0 8px rgba(255, 105, 180, 0.7); /* Signature website glow */
        }

        .messages-window {
            flex: 1;
            background: #0a0509; /* Deep inner backdrop match */
            border: 1px solid rgba(255, 105, 180, 0.1);
            border-radius: 14px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9);
        }

        /* Custom Scrollbar for Chat Window */
        .messages-window::-webkit-scrollbar {
            width: 6px;
        }
        .messages-window::-webkit-scrollbar-thumb {
            background: #ff69b4;
            border-radius: 10px;
        }

        .chat-bubble {
            color: #e7e7e7;
            font-size: 0.95rem;
            line-height: 1.4;
            text-align: left;
        }

        .chat-meta {
            font-size: 0.75rem;
            color: #ff69b4;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-right: 6px;
        }

        .chat-timestamp {
            font-size: 0.75rem;
            color: #aaa;
            margin-left: 6px;
            font-variant-numeric: tabular-nums;
        }

        .chat-input-bar {
            display: flex;
            gap: 12px;
        }

        .chat-input {
            flex: 1;
            background: #120910;
            border: 1px solid rgba(255, 105, 180, 0.2);
            border-radius: 12px;
            padding: 12px 20px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .chat-input:focus {
            border-color: #ff69b4;
            box-shadow: 0 0 10px rgba(255, 105, 180, 0.2);
        }

        .chat-send-btn {
            background: transparent;
            border: 1px solid #ff69b4;
            color: #ff69b4;
            padding: 0 22px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .chat-send-btn:hover {
            background: #ff69b4;
            color: #120910;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.4);
        }
    </style>
</head>
<body>

    <!-- SIDEBAR NAVIGATION LAYER (Keeps layout consistent with your website vibe) -->
    <div class="sidebar">
        <div class="logo-container">
            <!-- Your logo image can remain here inside layout wrapper grids -->
        </div>
        <a href="index.html" class="nav-btn">Home</a>
    </div>

    <!-- MAIN APP CANVAS PANEL -->
    <div class="main">
        <div class="chat-container">
            <div class="chat-header">
                <h2>Live Transmission</h2>
            </div>
            <div class="messages-window" id="chat-window">
                <!-- Database rows render inside here automatically -->
            </div>
            <form class="chat-input-bar" id="chat-form">
                <input type="text" id="chat-msg" class="chat-input" placeholder="Type an encrypted transmission..." autocomplete="off" required>
                <button type="submit" class="chat-send-btn">SEND</button>
            </form>
        </div>
    </div>

    <!-- Script asset link pipeline hook -->
    <script src="chat.js"></script>
</body>
</html>
