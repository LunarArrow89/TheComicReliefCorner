<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff69b4">
  <title>Chatroom | The Comic Relief Corner</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="load.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="chat.js"></script>
  <style>
    .chatroom-page { width: min(100% - 32px, 900px); margin: 28px auto 48px; }
    .chatroom-heading { margin-bottom: 20px; }
    .chatroom-heading h1 { margin: 0 0 8px; }
    .chatroom-heading p { margin: 0; opacity: .8; }
    .chat-container { box-sizing: border-box; width: 100%; max-width: 900px; min-height: 480px; margin: 0 auto; padding: 22px; display: flex; flex-direction: column; gap: 16px; border-radius: 18px; background: var(--card-bg, #1f121b); border: 1px solid rgba(255,105,180,.28); box-shadow: 0 8px 28px rgba(0,0,0,.2); }
    .chat-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .chat-header h2 { margin: 0; font-size: 1.25rem; }
    .chat-status { font-size: .85rem; opacity: .75; }
    .messages-window { flex: 1; min-height: 280px; max-height: min(58vh, 560px); overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 12px; background: rgba(0,0,0,.2); border: 1px solid rgba(255,105,180,.15); }
    .chat-bubble { overflow-wrap: anywhere; padding: 10px 12px; border-radius: 10px; background: rgba(255,105,180,.08); line-height: 1.45; }
    .chat-meta { font-weight: 700; color: #ff69b4; margin-right: 6px; }
    .chat-timestamp { display: block; margin-top: 4px; font-size: .75rem; opacity: .65; }
    .chat-input-bar { display: flex; gap: 10px; width: 100%; }
    .chat-input { box-sizing: border-box; min-width: 0; flex: 1; padding: 13px 15px; border-radius: 10px; color: inherit; background: rgba(0,0,0,.2); border: 1px solid rgba(255,105,180,.35); font: inherit; }
    .chat-input:focus { outline: 2px solid rgba(255,105,180,.35); outline-offset: 1px; }
    .chat-send-btn { padding: 11px 18px; border: 1px solid #ff69b4; border-radius: 10px; background: #ff69b4; color: #24101c; font: inherit; font-weight: 700; cursor: pointer; }
    .chat-send-btn:hover { filter: brightness(1.08); }
    .chat-secondary-btn { background: transparent; color: inherit; }
    #auth-container { min-height: 0; max-width: 480px; margin-top: 24px; }
    #auth-form { display: flex; flex-direction: column; gap: 12px; }
    .auth-actions { display: flex; gap: 10px; }
    .auth-actions button { flex: 1; }
    #auth-error { margin: 0; color: #ff6b6b; overflow-wrap: anywhere; }
    .chat-empty { margin: auto; padding: 28px 12px; text-align: center; opacity: .7; }
    @media (max-width: 560px) {
      .chatroom-page { width: min(100% - 20px, 900px); margin-top: 18px; }
      .chat-container { padding: 14px; min-height: 440px; }
      .chat-input-bar { gap: 7px; }
      .chat-send-btn { padding: 10px 13px; }
      .messages-window { padding: 10px; }
    }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>
  <div id="header-container"></div>

  <main class="main chatroom-page">
    <header class="chatroom-heading">
      <h1>Chatroom</h1>
      <p>Talk with the Comic Relief Corner community.</p>
    </header>

    <section id="auth-container" class="chat-container" aria-labelledby="auth-title">
      <div class="chat-header">
        <h2 id="auth-title">Welcome to the chatroom</h2>
      </div>
      <p style="margin:0;opacity:.8">Log in or create an account to join the conversation.</p>
      <form id="auth-form">
        <label for="auth-email">Email address</label>
        <input type="email" id="auth-email" class="chat-input" placeholder="you@example.com" autocomplete="email" required>
        <label for="auth-password">Password</label>
        <input type="password" id="auth-password" class="chat-input" placeholder="At least 6 characters" minlength="6" autocomplete="current-password" required>
        <div class="auth-actions">
          <button type="submit" id="login-btn" class="chat-send-btn">Log in</button>
          <button type="button" id="signup-btn" class="chat-send-btn chat-secondary-btn">Create account</button>
        </div>
        <p id="auth-error" role="alert" hidden></p>
      </form>
    </section>

    <section id="secure-chat-container" class="chat-container" style="display:none" aria-label="Community chat">
      <div class="chat-header">
        <div>
          <h2>Community chat</h2>
          <span class="chat-status">Messages from the community</span>
        </div>
        <button type="button" id="logout-btn" class="chat-send-btn chat-secondary-btn">Log out</button>
      </div>
      <div class="messages-window" id="chat-window" aria-live="polite" aria-label="Chat messages">
        <p class="chat-empty">Loading messages…</p>
      </div>
      <form class="chat-input-bar" id="chat-form">
        <input type="text" id="chat-msg" class="chat-input" placeholder="Write a message…" maxlength="1000" autocomplete="off" required aria-label="Your message">
        <button type="submit" class="chat-send-btn">Send</button>
      </form>
    </section>
  </main>
</body>
</html>
