<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Portal</title>
    <style>
        :root {
            --bg-primary: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border: #e2e8f0;
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Responsive Global Navigation Bar */
        .navbar {
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background-color: var(--accent);
            border-radius: var(--radius);
            display: grid;
            place-items: center;
            color: white;
        }

        .nav-menu {
            display: flex;
            gap: 1rem;
            list-style: none;
            align-items: center;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
            transition: all 0.2s ease;
        }

        .nav-link:hover {
            color: var(--text-main);
            background-color: var(--bg-primary);
        }

        /* Active Context Indicator */
        .nav-link.active {
            color: var(--accent);
            background-color: #eff6ff;
            font-weight: 600;
        }

        /* Central Layout Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding: 4rem 2rem;
            flex: 1;
            display: flex;
            align-items: center;
        }

        /* Presentation Hero Block */
        .hero {
            max-width: 700px;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.15;
            margin-bottom: 1.5rem;
        }

        .dynamic-keyword {
            color: var(--accent);
            position: relative;
            display: inline-block;
        }

        .hero-desc {
            font-size: 1.25rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        /* Action Controller Elements */
        .interactive-panel {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            border-radius: var(--radius);
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            font-size: 1rem;
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .btn-secondary:hover {
            background-color: var(--surface);
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 2.5rem;
            }
            .navbar {
                padding: 1rem;
            }
            .container {
                padding: 2rem 1rem;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="brand">
            <div class="brand-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"/></svg>
            </div>
            <span>EduSphere</span>
        </a>
        <ul class="nav-menu">
            <li><a href="#" class="nav-link">Home</a></li>
            <li><a href="#" class="nav-link">Login</a></li>
            <li><a href="#" class="nav-link active">Campus Portal</a></li>
        </ul>
    </nav>

    <main class="container">
        <section class="hero">
            <h1 class="hero-title">
                Welcome to <br>
                <span class="dynamic-keyword" id="target-word">Innovation</span>
            </h1>
            <p class="hero-desc">
                Experience an adaptive institutional platform configured to manage your academic lifecycle cleanly, efficiently, and modularly.
            </p>
            <div class="interactive-panel">
                <button class="btn btn-primary" onclick="mutateWord()">Regenerate Context</button>
                <a href="#" class="btn btn-secondary">Explore Portal</a>
            </div>
        </section>
    </main>

    <script>
        // High-utility token bank for interface generation
        const vocabularyPool = [
            "Excellence",
            "Discovery",
            "Sovereignty",
            "Perspective",
            "Synergy",
            "Academics",
            "Foundations",
            "Transformation"
        ];

        let executionPointer = 0;

        // Fisher-Yates array shuffling logic to enforce absolute randomness patterns
        function structuralShuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Initialize state sequence mapping
        structuralShuffle(vocabularyPool);

        // Core visual mutation controller
        function mutateWord() {
            const displayElement = document.getElementById('target-word');
            
            // Cycle back gracefully if threshold limit is hit
            if (executionPointer >= vocabularyPool.length) {
                structuralShuffle(vocabularyPool);
                executionPointer = 0;
            }

            // Apply mutation output directly to active DOM text node
            displayElement.textContent = vocabularyPool[executionPointer];
            executionPointer++;
        }
    </script>

</body>
</html>
