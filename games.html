<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>The Comic Relief Corner - Games</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Your Base CSS (Unified Spacing Architecture) -->
    <link rel="stylesheet" href="style.css?v=unified_spacing">
    <!-- Game Layer Stylesheet -->
    <link rel="stylesheet" href="game-style.css">
    <!-- Loader Script -->
    <script defer src="load.js"></script>
</head>
<body>

    <!-- OVERVIEW CONTROLLERS LOADS FROM LOAD.JS -->

            <!-- CUPHEAD GAME CARD LINK -->
            <div class="game-card" onclick="openGameModal('Hole.io', 'hole_io.html')">

                </div>
            </div>

            <!-- CUPHEAD GAME CARD LINK -->
            <div class="game-card" onclick="openGameModal('Human Expenditure Program', 'Human Expenditure Program.html')">
                <img src="human_expidenture.jpeg" alt="Cover Image" class="game-card-img">
                <div class="game-card-overlay">
                    <h3 class="game-card-title">Human Expenditure Program</h3>
                </div>
            </div>

            <!-- CUPHEAD GAME CARD LINK -->
            <div class="game-card" onclick="openGameModal('Kindergarten', 'Kindergarten.html')">
                <img src="kindergarten.jpeg" alt="Cover Image" class="game-card-img">
                <div class="game-card-overlay">

                </div>
            </div>

            <!-- CUPHEAD GAME CARD LINK -->
            <div class="game-card" onclick="openGameModal('Basketball Stars', 'Basketball Stars.html')">
                <img src="basketball_stars.jpeg" alt="Cover Image" class="game-card-img">
                <div class="game-card-overlay">
                    <h3 class="game-card-title">Basketball Stars</h3>
                </div>
            </div>
            
            <!-- CUPHEAD GAME CARD LINK -->
            <div class="game-card" onclick="openGameModal('Cuphead', 'cup_head.html')">
                <img src="cup_head.jpeg" alt="Cuphead Cover Image" class="game-card-img">
                <div class="game-card-overlay">
                    <h3 class="game-card-title">Cuphead</h3>
                </div>
            </div>

            <!-- GAME CARD 2 -->
            <div class="game-card" onclick="openGameModal('Bridge Race', 'Bridge_Race.html')">

                </div>
            </div>

            <!-- GAME CARD 3 -->
            <div class="game-card" onclick="openGameModal('Bart Bash', 'bart_bash.html')">
                <img src="bart_bash.jpeg" alt="Game Cover" class="game-card-img">
                <div class="game-card-overlay">
                    <h3 class="game-card-title">Bart Bash</h3>
                </div>

            <!-- GAME CARD 4 -->

                </div>
            </div>

        </div>
    </div>

    <!-- OVERLAY POP-UP SYSTEM CONTAINER (Matches your structural drawing sketch layout) -->
    <div class="game-modal-backdrop" id="gameModal">
        <div class="game-modal-window">
            
            <!-- Header Row Controls Bar -->
            <div class="game-modal-header">
                <span class="game-modal-title" id="modalGameTitle">Game Title</span>
                <button class="game-modal-close-btn" onclick="closeGameModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Sandbox Viewport Frame Box Layer -->
            <div class="game-modal-viewport">
                <iframe src="about:blank" id="modalGameIframe"></iframe>
            </div>

        </div>
    </div>

    <!-- CORE GAME ENGINE INTERACTION FUNCTIONS -->
    <script>
        const modal = document.getElementById('gameModal');
        const mainContent = document.getElementById('main-content-blur-target');
        const iframe = document.getElementById('modalGameIframe');
        const titleText = document.getElementById('modalGameTitle');

        // Function execution loop triggering overlay systems viewstate
        function openGameModal(title, fileUrl) {
            titleText.textContent = title;
            iframe.src = fileUrl;
            modal.classList.add('modal-active');
            mainContent.classList.add('background-blur-active');
        }

        // Clean interface reset dumping active frames components cleanly
        function closeGameModal() {
            modal.classList.remove('modal-active');
            mainContent.classList.remove('background-blur-active');
            iframe.src = 'about:blank'; // Stops performance threads or game sound buffers instantly
        }

        // Close instantly if user clicks out inside background layer space bounds
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closeGameModal();
            }
        });
    </script>

</body>
</html>
