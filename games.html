<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Comic Relief Corner - Games Grid</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Your CSS (Unified Spacing Architecture) -->
    <link rel="stylesheet" href="style.css?v=unified_spacing">
    <!-- Loader Script -->
    <script defer src="load.js"></script>
</head>
<body>

    <!-- SIDEBAR LOADS HERE FROM LOAD.JS -->
    <div id="sidebar-container"></div>

    <!-- HEADER LOADS HERE FROM LOAD.JS -->
    <div id="header-container"></div>

    <!-- MAIN CONTENT ONLY -->
    <div class="main">
        
        <div class="hero">
            <h1>Games</h1>
            <p>The main program</p>
        </div>

        <!-- 1. MAIN LARGE PLAY VIEWPORT SCREEN AREA -->
        <div class="feature-layout-row">
            <div class="feature-box-rectangle">
                <iframe src="about:blank" style="width: 100%; height: 100%; border: none; background: #0a0509; border-radius: 14px;"></iframe>
            </div>
        </div>

        <!-- 2. HIGH RELEVANCE GRID SELECTOR -->
        <!-- Native reuse of your Cinema Poster Grid Engine classes -->
        <div class="movie-poster-grid">
            
            <!-- GAME CARD 1 -->
            <a href="#" class="poster-card">
                <img src="game1.jpg" alt="Game Cover Image">
                <div class="poster-info">
                    <h3><b>Game Title A</b></h3>
                </div>
            </a>

            <!-- GAME CARD 2 -->
            <a href="#" class="poster-card">
                <img src="game2.jpg" alt="Game Cover Image">
                <div class="poster-info">
                    <h3><b>Game Title B</b></h3>
                </div>
            </a>

            <!-- GAME CARD 3 -->
            <a href="#" class="poster-card">
                <img src="game3.jpg" alt="Game Cover Image">
                <div class="poster-info">
                    <h3><b>Game Title C</b></h3>
                </div>
            </a>

            <!-- GAME CARD 4 -->
            <a href="#" class="poster-card">
                <img src="game4.jpg" alt="Game Cover Image">
                <div class="poster-info">
                    <h3><b>Game Title D</b></h3>
                </div>
            </a>

            <!-- GAME CARD 5 -->
            <a href="#" class="poster-card">
                <img src="game5.jpg" alt="Game Cover Image">
                <div class="poster-info">
                    <h3><b>Game Title E</b></h3>
                </div>
            </a>

            <!-- GAME CARD 6 -->
            <a href="#" class="poster-card">
                <img src="game6.jpg" alt="Game Cover Image">
                <div class="poster-info">
                    <h3><b>Game Title F</b></h3>
                </div>
            </a>

            <!-- GAME CARD 7 -->
            <a href="#" class="poster-card">
                <img src="game7.jpg" alt="Game Cover Image">
                <div class="poster-info">
                    <h3><b>Game Title G</b></h3>
                </div>
            </a>

        </div>

    </div>
</body>
</html>
