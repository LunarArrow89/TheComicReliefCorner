<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Comic Relief Corner - Games</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Your Base CSS (Unified Spacing Architecture) -->
    <link rel="stylesheet" href="style.css?v=unified_spacing">
    <!-- Game Layer Stylesheet -->
    <link rel="stylesheet" href="game-style.css">
    <!-- Loader Script -->
    <script defer src="load.js"></script>
</head>
<body>

    <!-- SIDEBAR LOADS HERE FROM LOAD.JS -->
    <div id="sidebar-container"></div>

    <!-- HEADER LOADS HERE FROM LOAD.JS -->
    <div id="header-container"></div>

    <!-- MAIN CONTENT ONLY -->
    <div class="main">
        
        <div class="hero">
            <h1>The Gaming Deck</h1>
            <p>Your one-way ticket to pure entertainment.</p>
        </div>

        <!-- 1. MAIN LARGE PLAY VIEWPORT SCREEN AREA -->
        <div class="feature-layout-row">
            <div class="feature-box-rectangle">
                <iframe src="about:blank" style="width: 100%; height: 100%; border: none; background: #0a0509; border-radius: 14px;"></iframe>
            </div>
        </div>

        <!-- 2. GAME SELECTION HOVER SQUARE GRID -->
        <div class="game-square-grid">
            
            <!-- GAME CARD 1 -->
            <div class="game-card">
                <img src="game1.jpg" alt="Game Cover" class="game-card-img">
                <div class="game-card-overlay">
                    <h3 class="game-card-title">Cyber Racer</h3>
                </div>
            </div>

            <!-- GAME CARD 2 -->
            <div class="game-card">
                <img src="game2.jpg" alt="Game Cover" class="game-card-img">
                <div class="game-card-overlay">
                    <h3 class="game-card-title">Neon Breakout</h3>
                </div>
            </div>

            <!-- GAME CARD 3 -->
            <div class="game-card">
                <img src="game3.jpg" alt="Game Cover" class="game-card-img">
                <div class="game-card-overlay">
                    <h3 class="game-card-title">Space Invaders</h3>
                </div>
            </div>

            <!-- GAME CARD 4 -->
            <div class="game-card">
                <img src="game4.jpg" alt="Game Cover" class="game-card-img">
                <div class="game-card-overlay">
                    <h3 class="game-card-title">Pixel Quest</h3>
                </div>
            </div>

            <!-- GAME CARD 5 -->
            <div class="game-card">
                <img src="game5.jpg" alt="Game Cover" class="game-card-img">
                <div class="game-card-overlay">
                    <h3 class="game-card-title">Synth Wave</h3>
                </div>
            </div>

        </div>

    </div>
</body>
</html>
