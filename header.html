<div class="header">

    <div class="time-box" id="timeBox"></div>
    <div class="date-box" id="dateBox"></div>

    <div class="ticker-wrap">
        <div class="ticker">
            Welcome to The Comic Relief Corner • Everything now works • No broken loading •
        </div>
    </div>

</div>

<script>
function updateClock(){
    const now = new Date();
    document.getElementById("timeBox").innerText = now.toLocaleTimeString();
    document.getElementById("dateBox").innerText = now.toLocaleDateString();
}
setInterval(updateClock,1000);
updateClock();
</script>
