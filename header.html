<div class="header"> 
    <div class="time-box" id="timeBox"></div> 
    <div class="date-box" id="dateBox"></div> 
    <!-- New typing container -->
    <div class="typing-box" id="typingBox"></div> 
    
    <div class="ticker-wrap"> 
        <div class="ticker"> \( ᐖ)/ Welcome to The Comic Relief Corner!! Here, you can play games, browse the web, or hang out in the chatroom! Can't find something you want? Request it via the request form! \(ᐖ )/ </div> 
    </div> 
</div> 

<script> 
function updateClock(){ 
    const now = new Date(); 
    document.getElementById("timeBox").innerText = now.toLocaleTimeString(); 
    document.getElementById("dateBox").innerText = now.toLocaleDateString(); 
} 
setInterval(updateClock,1000); 
updateClock(); 

// --- Typing Effect Logic ---
const phrases = [
    "When the when is very when",
    "Bob Ross my beloved",
    "Um yeah so like skibidi",
    "Why did the HTML code cross the road?",
    "Look for the hidden pages...",
    "Gay frogs"
];

const typingElement = document.getElementById("typingBox");
let phraseIndex = 0;
let charIndex = 0;
let isDeleting = false;

function typeEffect() {
    const currentPhrase = phrases[phraseIndex];
    
    if (isDeleting) {
        // Remove characters
        typingElement.innerText = currentPhrase.substring(0, charIndex - 1);
        charIndex--;
    } else {
        // Add characters
        typingElement.innerText = currentPhrase.substring(0, charIndex + 1);
        charIndex++;
    }

    // Determine typing speed
    let speed = isDeleting ? 50 : 100;

    // Phrase is fully typed out
    if (!isDeleting && charIndex === currentPhrase.length) {
        speed = 2000; // Pause at the end of the sentence
        isDeleting = true;
    } 
    // Phrase is fully deleted
    else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        phraseIndex = (phraseIndex + 1) % phrases.length; // Move to next random phrase
        speed = 500; // Pause before typing next phrase
    }

    setTimeout(typeEffect, speed);
}

// Start the typing effect
typeEffect();
</script>
