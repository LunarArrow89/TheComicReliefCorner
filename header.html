<style>
    /* Styling to blend seamlessly with the header text boxes */
    .header {
        display: flex;
        align-items: center;
        gap: 10px; /* Adjust spacing to match your other elements */
    }
    
    .bmc-inline-btn {
        background-color: #FFDD00;
        color: #000000;
        font-family: sans-serif;
        font-size: 14px;
        font-weight: bold;
        text-decoration: none;
        padding: 6px 16px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        height: fit-content;
        transition: background-color 0.2s;
    }

    .bmc-inline-btn:hover {
        background-color: #ffea6c;
    }
</style>

<script> 
function updateClock(){ 
    const now = new Date(); 
    document.getElementById("timeBox").innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}); 
    document.getElementById("dateBox").innerText = now.toLocaleDateString([], {month: 'SHORT_OR_YOUR_FORMAT', day: 'numeric'}); 
} 
setInterval(updateClock,1000); 
updateClock(); 
</script>
