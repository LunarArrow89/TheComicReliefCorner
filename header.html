<!-- ==========================================================================
     INTEGRATED SITE HEADER REGION
     ========================================================================== -->
<div class="header"> 
    <!-- Grouped Metadata Columns (Keeps elements organized together on the left) -->
    <div class="meta-widgets">
        <div class="datetime-row">
            <div class="time-box" id="timeBox"></div> 
            <div class="date-box" id="dateBox"></div> 
        </div>
        <!-- Typewriter system placeholder drops perfectly directly underneath -->
        <div class="typing-box" id="typingBox"></div> 
    </div>
    
    <!-- Seamless Scrolling Text Ticker Area (Spans across the remaining right area) -->
    <div class="ticker-wrap"> 
        <div class="ticker"> \( ᐖ)/ Welcome to The Comic Relief Corner!! Here, you can play games, browse the web, or hang out in the chatroom! Can't find something you want? Request it via the request form! \(ᐖ )/ </div> 
    </div> 
</div> 

<!-- ==========================================================================
     DYNAMIC ENGINE FUNCTIONS
     ========================================================================== -->
<script> 
// 1. DYNAMIC SYSTEM LIVE CLOCK ENGINE
function updateClock(){ 
    const now = new Date(); 
    document.getElementById("timeBox").innerText = now.toLocaleTimeString(); 
    document.getElementById("dateBox").innerText = now.toLocaleDateString(); 
} 
setInterval(updateClock, 1000); 
updateClock(); 

// 2. TIMED TYPEWRITER CHARACTER LOOPS
const phrases = [ 
    "When the when is very when", 
    "Bob Ross my beloved", 
    "Um yeah so like skibidi", 
    "Why did the HTML code cross the road?", 
    "Look for the hidden pages...", 
    "Gay frogs" 
];

const typingElement = document.getElementById("typingBox");
let phraseIndex = 0;
let charIndex = 0;
let isDeleting = false;

function typeEffect() {
    const currentPhrase = phrases[phraseIndex];
    
    if (isDeleting) {
        // Strip string characters progressively backwards
        typingElement.innerText = currentPhrase.substring(0, charIndex - 1);
        charIndex--;
    } else {
        // Append next incremental letter chunk forwards
        typingElement.innerText = currentPhrase.substring(0, charIndex + 1);
        charIndex++;
    }

    // Set engine intervals for active fluid generation strokes
    let speed = isDeleting ? 40 : 80;

    if (!isDeleting && charIndex === currentPhrase.length) {
        speed = 2000; // Pause framework index once full line generation completes
        isDeleting = true;
    } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        // Native randomized selector arrays routing different string outputs
        phraseIndex = Math.floor(Math.random() * phrases.length); 
        speed = 400; // Clean timing hold framework break prior to re-typing
    }

    setTimeout(typeEffect, speed);
}

// Fire engine thread on load execution parameters
typeEffect();
</script>
