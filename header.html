<!-- ==========================================================================
     INTEGRATED HEADER ARCHITECTURE (HORIZONTAL WIDGET TIERS)
     ========================================================================== -->
<div class="header"> 
    <!-- Structural Wrapper: Columns widgets neatly to the left of the ticker -->
<div class="meta-widgets">
    <div class="datetime-row">
        <div class="time-box"></div> 
        <div class="date-box"></div> 
    </div>
    <!-- Missing container added to handle the type engine script safely -->
    <div class="typing-box" id="typingBox"></div> 
</div>

<div class="ticker-wrap"> 
    <div class="ticker"> \( ᐖ)/ Welcome to The Comic Relief Corner!! Here, you can play games, browse the web, or hang out in the chatroom! Can't find something you want? Request it via the request form! \(ᐖ )/ </div> 
</div>


<!-- ==========================================================================
     DYNAMIC ENGINE FUNCTIONS
     ========================================================================== -->
<script> 
// 1. DIGITAL CLOCK STATE MATRIX
function updateClock(){ 
    const now = new Date(); 
    document.getElementById("timeBox").innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); 
    document.getElementById("dateBox").innerText = now.toLocaleDateString([], { month: 'short', day: 'numeric' }).toUpperCase(); 
} 
setInterval(updateClock, 1000); 
updateClock(); 

// 2. TIMED TYPEWRITER CHARACTER LOOPS
const phrases = [ 
    "When the when is very when", 
    "Bob Ross my beloved", 
    "Um yeah so like skibidi", 
    "Why did the HTML code cross the road?", 
    "Look for the hidden pages...", 
    "Gay frogs" 
];

const typingElement = document.getElementById("typingBox");
let phraseIndex = 0;
let charIndex = 0;
let isDeleting = false;

function typeEffect() {
    const currentPhrase = phrases[phraseIndex];
    
    if (isDeleting) {
        typingElement.innerText = currentPhrase.substring(0, charIndex - 1);
        charIndex--;
    } else {
        typingElement.innerText = currentPhrase.substring(0, charIndex + 1);
        charIndex++;
    }

    let speed = isDeleting ? 40 : 80;

    if (!isDeleting && charIndex === currentPhrase.length) {
        speed = 2000; 
        isDeleting = true;
    } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        phraseIndex = Math.floor(Math.random() * phrases.length); 
        speed = 400; 
    }

    setTimeout(typeEffect, speed);
}

// Fire type loop engine
typeEffect();
</script>
