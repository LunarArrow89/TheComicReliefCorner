<!-- HTML Structure --> 
<div class="header"> 
  <div class="time-box" id="timeBox">05:04 PM</div> 
  <div class="date-box" id="dateBox">AUG 23</div> 
  
  <a href="https://buymeacoffee.com" target="_blank" class="bmc-inline-btn"> 
    Donate 
  </a> 
  
  <!-- Optimized fluid width layout wrapper track --> 
  <div class="ticker-wrap"> 
    <div class="ticker">
      \( ᐖ)/ Welcome to The Comic Relief Corner!! Here, you can play games, browse the web, or hang out in the chatroom! Can't find something you want? Request it via the request form! \(ᐖ )/ 
    </div> 
  </div> 

  <!-- Square Send Link Button (FIXED: Removed conflicting inline onclick property) --> 
  <a href="#" class="send-btn" id="openModalBtn" aria-label="Send to Creator"> 
    <img src="send.png" alt="Send Icon" class="send-icon"> 
  </a> 
</div> 

<!-- Backdrop Blur Modal Overlay --> 
<div class="modal-overlay" id="requestModal"> 
  <div class="modal-content"> 
    <!-- Added Close Trigger Element Icon Button -->
    <button type="button" class="close-btn" id="closeModalBtn" aria-label="Close form Modal">&times;</button> 
    <h2>Submit a Request</h2> 
    <p>Got an idea or feedback? Send it straight to the creator.</p> 
    
    <form id="requestForm"> 
      <div class="input-group"> 
        <textarea id="userMessage" name="Message" placeholder="Type your request here..." required></textarea> 
      </div> 
      <button type="submit" class="submit-btn" id="submitBtn">Send Request</button> 
    </form> 
    
    <div id="formStatus" class="status-msg"></div> 
  </div> 
</div> 

<!-- INLINE CACHE-BUSTING CRITICAL STYLES -->
<style>
.modal-overlay {
  display: none;
  position: fixed !important; 
  top: 0 !important;          
  left: 0 !important;         
  width: 100vw !important;    
  height: 100vh !important;   
  background-color: rgba(10, 5, 12, 0.85) !important; 
  backdrop-filter: blur(8px) !important;
  -webkit-backdrop-filter: blur(8px) !important;
  z-index: 999999 !important;  
  justify-content: center !important;    
  align-items: center !important;        
  box-sizing: border-box !important;
}

.modal-content {
  background-color: #120910 !important;
  border: 1px solid rgba(255, 105, 180, 0.25) !important;
  border-radius: 20px !important;
  width: 440px !important;
  max-width: 90% !important;
  padding: 30px !important;
  box-sizing: border-box !important;
  position: relative !important;
  display: flex !important;
  flex-direction: column !important;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 105, 180, 0.1) !important;
  color: white !important;
}

.close-btn {
  position: absolute !important;
  top: 20px !important;
  right: 20px !important;
  background: none !important;
  border: none !important;
  color: #aaa !important;
  font-size: 26px !important;
  cursor: pointer !important;
  line-height: 1 !important;
}
.close-btn:hover { color: #ff69b4 !important; }
</style>

<script> 
// Modal Event Management 
const modal = document.getElementById('requestModal'); 
const openBtn = document.getElementById('openModalBtn'); 
const closeBtn = document.getElementById('closeModalBtn'); 
const form = document.getElementById('requestForm'); 
const statusMsg = document.getElementById('formStatus'); 
const submitBtn = document.getElementById('submitBtn'); 

if (openBtn) { 
  openBtn.onclick = (e) => { 
    e.preventDefault(); 
    if (modal) modal.style.display = 'flex'; 
    if (statusMsg) statusMsg.innerText = ''; 
  }; 
} 

if (closeBtn && modal) closeBtn.onclick = () => modal.style.display = 'none'; 
window.onclick = (e) => { 
  if (modal && e.target === modal) modal.style.display = 'none'; 
}; 

// Background Form Post Processing 
if (form) { 
  form.addEventListener('submit', function(e) { 
    e.preventDefault(); 
    submitBtn.disabled = true; 
    submitBtn.innerText = 'Sending...'; 
    if (statusMsg) {
      statusMsg.style.color = '#b3a6b5'; 
      statusMsg.innerText = 'Saving response...'; 
    }
    
    const formspreeURL = 'https://formspree.io'; 
    const formData = new FormData(form); 
    fetch(formspreeURL, { 
      method: 'POST', 
      body: formData, 
      headers: { 
        'Accept': 'application/json' 
      } 
    }) 
    .then(response => { 
      if (response.ok) { 
        submitBtn.disabled = false; 
        submitBtn.innerText = 'Send Request'; 
        if (statusMsg) {
          statusMsg.style.color = '#00ffcc'; 
          statusMsg.innerText = '✓ Request saved successfully!'; 
        }
        form.reset(); 
        setTimeout(() => { 
          if (modal) modal.style.display = 'none'; 
        }, 1500); 
      } else { 
        throw new Error('Network error'); 
      } 
    }) 
    .catch(error => { 
      submitBtn.disabled = false; 
      submitBtn.innerText = 'Send Request'; 
      if (statusMsg) {
        statusMsg.style.color = '#ff3366'; 
        statusMsg.innerText = 'Error saving request.'; 
      }
    }); 
  }); 
} 

// Live-Updating Synchronized Clock Engine 
function updateClock(){ 
  const now = new Date(); 
  const timeBox = document.getElementById("timeBox"); 
  const dateBox = document.getElementById("dateBox"); 
  if (timeBox) { 
    timeBox.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); 
  } 
  if (dateBox) { 
    const rawDate = now.toLocaleDateString([], {month: 'short', day: 'numeric'}); 
    dateBox.innerText = rawDate.toUpperCase(); 
  } 
} 
setInterval(updateClock, 1000); 
updateClock(); 
</script>
