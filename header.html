<div class="header">

  <div class="date-box" id="dateBox">AUG 23</div> 
  
  <a href="https://buymeacoffee.com/lunararrow89" target="_blank" class="bmc-inline-btn"> Donate </a> 
  
  <div class="ticker-wrap">

<div class="modal-overlay" id="requestModal">
  <div class="modal-content">
    <button type="button" class="close-btn" id="closeModalBtn">&times;</button>
    <h2>Submit a Request</h2>

    <form id="requestForm">
      <div class="input-group">
        <textarea id="userMessage" name="Message" placeholder="Type your request here..." required></textarea>

      <button type="submit" class="submit-btn" id="submitBtn">Send Request</button>
    </form>
    <div id="formStatus" class="status-msg"></div>
  </div>
</div>

<style> 
/* Navigation Layout Core */
.header { 
  display: flex; 
  align-items: center; 
  gap: 10px; 
} 

.bmc-inline-btn { 
  background-color: #1a0e1c; 
  color: #ffffff; 
  font-family: inherit; 
  font-size: 14px; 
  text-decoration: none; 
  padding: 6px 16px; 
  border-radius: 8px; 
  border: 1px solid rgba(255, 255, 255, 0.08); 
  display: inline-flex; 
  align-items: center; 
  justify-content: center; 
  white-space: nowrap; 
  height: fit-content; 
  box-sizing: border-box; 
  cursor: pointer; 
  transition: all 0.25s ease-in-out; 
} 

.bmc-inline-btn:hover { 
  background-color: #251429; 
  color: #ff5ebb; 
  border-color: #ff5ebb; 
  box-shadow: 0 0 15px rgba(255, 94, 187, 0.8), inset 0 0 4px rgba(255, 94, 187, 0.4); 
} 

/* Fixed Native Anchor Square Setup */
.send-btn {
  background-color: #1a0e1c;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  width: 34px;       
  height: 34px;      
  min-width: 34px;   /* Ensures layout engine cannot shrink the square */
  min-height: 34px;
  box-sizing: border-box;
  cursor: pointer;
  transition: all 0.25s ease-in-out;
  margin-left: auto; /* Pushes element smoothly to the far right edge */
}

.send-btn:hover {
  background-color: #251429;
  border-color: #ff5ebb;
  box-shadow: 0 0 15px rgba(255, 94, 187, 0.8), inset 0 0 4px rgba(255, 94, 187, 0.4);
}

.send-icon {
  width: 18px;
  height: 18px;
  object-fit: contain;
}

/* Modal UI Glass Overlay Window Box */
.modal-overlay {
  display: none; 
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(10, 5, 12, 0.6); 
  backdrop-filter: blur(8px); 
  -webkit-backdrop-filter: blur(8px);
  z-index: 9999;
  justify-content: center;
  align-items: center;
}

.modal-content {
  background-color: #120814; 
  border: 2px solid rgba(255, 94, 187, 0.3); 
  border-radius: 12px;
  width: 400px;
  height: 400px; 
  padding: 30px;
  box-sizing: border-box;
  position: relative;
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 30px rgba(0, 0, 0, 0.7), 0 0 15px rgba(255, 94, 187, 0.1);
  color: #ffffff;
  font-family: inherit;
}

.modal-content h2 {
  margin-top: 0;
  margin-bottom: 5px;
  font-size: 22px;
  color: #ff5ebb; 
}

.modal-content p {
  color: #b3a6b5;
  font-size: 13px;
  margin-top: 0;
  margin-bottom: 20px;
}

.input-group {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  margin-bottom: 15px;
}

textarea {
  width: 100%;
  height: 140px;
  background-color: #1a0e1c;
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  padding: 12px;
  color: #ffffff;
  font-family: inherit;
  font-size: 14px;
  resize: none;
  box-sizing: border-box;
  outline: none;
  transition: border-color 0.25s, box-shadow 0.25s;
}

textarea:focus {
  border-color: #ff5ebb;
  box-shadow: 0 0 10px rgba(255, 94, 187, 0.3);
}

.submit-btn {
  background-color: #1a0e1c;
  color: #ffffff;
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  padding: 12px;
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
  width: 100%;
  transition: all 0.25s ease-in-out;
}

.submit-btn:hover {
  background-color: #251429;
  color: #ff5ebb;
  border-color: #ff5ebb;
  box-shadow: 0 0 15px rgba(255, 94, 187, 0.5);
}

.close-btn {
  position: absolute;
  top: 15px;
  right: 15px;
  background: none;
  border: none;
  color: #b3a6b5;
  font-size: 24px;
  cursor: pointer;
  transition: color 0.25s;
}

.close-btn:hover {
  color: #ff5ebb;
}

.status-msg {
  font-size: 13px;
  text-align: center;
  margin-top: 10px;
}
</style>

<script>
// Modal Event Elements
const modal = document.getElementById('requestModal');
const openBtn = document.getElementById('openModalBtn');
const closeBtn = document.getElementById('closeModalBtn');
const form = document.getElementById('requestForm');
const statusMsg = document.getElementById('formStatus');
const submitBtn = document.getElementById('submitBtn');

if (openBtn) {
  openBtn.onclick = (e) => { 
    e.preventDefault(); 
    if (modal) modal.style.display = 'flex'; 
    if (statusMsg) statusMsg.innerText = ''; 
  };
}
if (closeBtn && modal) closeBtn.onclick = () => modal.style.display = 'none';
window.onclick = (e) => { if (modal && e.target === modal) modal.style.display = 'none'; };

// Background Form Post Action Processing
if (form) {
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    
    submitBtn.disabled = true;
    submitBtn.innerText = 'Sending...';
    statusMsg.style.color = '#b3a6b5';
    statusMsg.innerText = 'Saving response...';

    // !!! REPLACE WITH YOUR UNIQUE FORMSPREE ENDPOINT URL ID !!!
    const formspreeURL = 'https://formspree.io/f/mljrkadg';

    const formData = new FormData(form);

    fetch(formspreeURL, {
      method: 'POST',
      body: formData,
      headers: { 'Accept': 'application/json' }
    })
    .then(response => {
      if (response.ok) {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Send Request';
        statusMsg.style.color = '#00ffcc'; 
        statusMsg.innerText = '✓ Request saved successfully!';
        form.reset();
        setTimeout(() => { if (modal) modal.style.display = 'none'; }, 1500);
      } else {
        throw new Error('Network error');
      }
    })
    .catch(error => {
      submitBtn.disabled = false;
      submitBtn.innerText = 'Send Request';
      statusMsg.style.color = '#ff3366'; 
      statusMsg.innerText = 'Error saving request.';
    });
  });
}

// Fixed Self-Updating Clock Engine 
function updateClock(){ 
  const now = new Date(); 
  const timeBox = document.getElementById("timeBox");
  const dateBox = document.getElementById("dateBox");
  
  if (timeBox) {
    timeBox.innerText = now.toLocaleTimeString([], {
      hour: '2-digit', 
      minute: '2-digit'
    });
  } 
  
  if (dateBox) {
    const rawDate = now.toLocaleDateString([], {month: 'short', day: 'numeric'});
    dateBox.innerText = rawDate.toUpperCase();
  }
} 

// Checks and renders changes live every single second
setInterval(updateClock, 1000); 
updateClock(); 
</script>
