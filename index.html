<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Comic Relief Corner - Home</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Gray background with a crisp white grid pattern */
        body {
            display: flex;
            height: 100vh;
            background-color: #303030;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.4) 1px, transparent 1px);
            background-size: 24px 24px;
            padding: 15px;
            gap: 15px;
            position: relative;
            overflow: hidden;
        }

        /* Left Navigation Sidebar */
        aside {
            width: 240px;
            background-color: rgba(74, 30, 38, 0.92);
            backdrop-filter: blur(8px);
            border: 2px solid #b86271;
            border-radius: 20px;
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            z-index: 1;
            position: relative;
            overflow: hidden;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            text-decoration: none;
            color: #ffccd5;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            z-index: 11;
        }

        .nav-item:hover, .nav-item.active {
            background-color: rgba(255, 182, 193, 0.2);
            border-color: #ff8fa3;
            transform: translateX(3px);
        }

        .nav-item .img-placeholder {
            width: 24px;
            height: 24px;
            background-color: #b86271;
            border-radius: 6px;
        }

        /* Main Workspace Section */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1;
        }

        /* Top Bar Container */
        header {
            background-color: rgba(74, 30, 38, 0.92);
            backdrop-filter: blur(8px);
            border: 2px solid #b86271;
            border-radius: 20px;
            padding: 15px 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        /* Scrolling Text Marquee Box */
        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            background-color: #3d141a;
            padding: 6px 0;
            border-radius: 10px;
            border: 1px solid #853744;
            z-index: 11;
        }

        .ticker {
            display: inline-block;
            white-space: nowrap;
            padding-right: 50px; /* Gives space between loops */
            color: #ffccd5;
            font-size: 14px;
            font-weight: 500;
            animation: marquee 15s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        /* Sub-Header Title */
        .header-title {
            color: #ffccd5;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 117, 143, 0.6);
            margin-top: 2px;
            margin-bottom: -4px;
            z-index: 11;
        }

        /* Central Layout Display Panel Box */
        .content-body {
            flex: 1;
            background-color: rgba(74, 30, 38, 0.92);
            backdrop-filter: blur(8px);
            border: 2px solid #b86271;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            padding: 40px;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            position: relative;
            overflow: hidden;
        }

        /* Glow Pink Title */
        .content-body h1 {
            font-size: 6rem;
            color: #fff;
            font-weight: 700;
            text-shadow: 
                0 0 10px #ff4d6d,
                0 0 20px #ff4d6d,
                0 0 40px #ff758f,
                0 0 80px #ff758f;
            letter-spacing: 2px;
            margin-top: 10px;
            margin-left: 15px;
            z-index: 11;
        }
    </style>
</head>
<body>

    <!-- Left Navigation Sidebar -->
    <aside>
        <a href="#" class="nav-item active">
            <div class="img-placeholder"></div>
            <span>Home</span>
        </a>

        <a href="#" class="nav-item">
            <div class="img-placeholder"></div>
            <span>Games</span>
        </a>

        <a href="#" class="nav-item">
            <div class="img-placeholder"></div>
            <span>Movies</span>
        </a>

        <a href="#" class="nav-item">
            <div class="img-placeholder"></div>
            <span>Chatroom</span>
        </a>

        <a href="#" class="nav-item">
            <div class="img-placeholder"></div>
            <span>Creators</span>
        </a>
    </aside>

    <!-- Main Content Container Area -->
    <main>

        <!-- Top Header Area -->
        <header>
            <!-- Scrolling Text Announcement Bar -->
            <div class="ticker-wrap">
                <!-- Text block duplicated inside to allow smooth, uninterrupted looping -->
                <div class="ticker">
                    🌸 Welcome to the Comic Relief Corner! Here you can play games, watch movies, or just hang out in the chat room!!🌸 &nbsp;
                    🌸 Welcome to the Comic Relief Corner! Here you can play games, watch movies, or just hang out in the chat room!!🌸
                </div>
            </div>

            <!-- Branding Subtitle -->
            <div class="header-title">
                The Comic Relief Corner
            </div>
        </header>

        <!-- Central Display Panel -->
        <div class="content-body">
            <h1>Welcome!</h1>
        </div>

    </main>

</body>
</html>
