<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Comic Relief Corner - Home</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #303030;
            background-image: 
                linear-gradient(rgba(255,255,255,0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.4) 1px, transparent 1px);
            background-size: 24px 24px;
            padding: 15px;
            gap: 15px;
            overflow: hidden;
        }

        /* SIDEBAR */
        aside {
            width: 260px;
            background-color: rgba(74, 30, 38, 0.95);
            border: 2px solid #b86271;
            border-radius: 20px;
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 18px;
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            transition: 0.2s;
        }

        /* IMAGE BACKGROUNDS */
        .nav-item::before {
            content: "";
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.35;
            z-index: 0;
        }

        .home::before {
            background-image: url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800");
        }

        .games::before {
            background-image: url("https://images.unsplash.com/photo-1552820728-8b83bb6b773f?auto=format&fit=crop&w=800");
        }

        .movies::before {
            background-image: url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=800");
        }

        .chat::before {
            background-image: url("https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=800");
        }

        .creators::before {
            background-image: url("https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=800");
        }

        .nav-item i, .nav-item span {
            position: relative;
            z-index: 2;
        }

        .nav-item:hover {
            transform: translateX(5px);
            border: 1px solid #ff8fa3;
        }

        /* MAIN */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        header {
            background-color: rgba(74, 30, 38, 0.95);
            border: 2px solid #b86271;
            border-radius: 20px;
            padding: 15px;
            color: white;
        }

        .ticker {
            white-space: nowrap;
            overflow: hidden;
        }

        .content {
            flex: 1;
            background-color: rgba(74, 30, 38, 0.95);
            border: 2px solid #b86271;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 4rem;
            font-weight: bold;
        }
    </style>
</head>

<body>

<aside>

    <a class="nav-item home" href="#">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
    </a>

    <a class="nav-item games" href="#">
        <i class="fa-solid fa-gamepad"></i>
        <span>Games</span>
    </a>

    <a class="nav-item movies" href="#">
        <i class="fa-solid fa-film"></i>
        <span>Movies</span>
    </a>

    <a class="nav-item chat" href="#">
        <i class="fa-solid fa-comments"></i>
        <span>Chat</span>
    </a>

    <a class="nav-item creators" href="#">
        <i class="fa-solid fa-user"></i>
        <span>Creators</span>
    </a>

</aside>

<main>

    <header>
        🌸 Welcome to the Comic Relief Corner!
    </header>

    <div class="content">
        HOME
    </div>

</main>

</body>
</html>
