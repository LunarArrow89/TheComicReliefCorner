
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Comic Relief Corner - Home</title>
    <!-- Font Awesome for clean, functional icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Gray background with a crisp white grid pattern */
        body {
            display: flex;
            height: 100vh;
            background-color: #303030;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.4) 1px, transparent 1px);
            background-size: 24px 24px;
            padding: 15px;
            gap: 15px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.20;
            mix-blend-mode: multiply;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://w3.org id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Left Navigation Sidebar */
        aside {
            width: 260px;
            min-width: 260px; 
            flex-shrink: 0; 
            background-color: rgba(74, 30, 38, 0.95);
            border: 2px solid #b86271;
            border-radius: 20px;
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            z-index: 11;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 18px;
            text-decoration: none;
            color: #ffccd5;
            font-size: 16px; 
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            white-space: nowrap; 
        }

        .nav-item i {
            font-size: 1.35rem;
            width: 24px;
            text-align: center;
            color: #b86271;
            transition: color 0.2s ease;
        }

        .nav-item:hover, .nav-item.active {
            background-color: rgba(255, 182, 193, 0.2);
            border-color: #ff8fa3;
            transform: translateX(5px);
        }

        .nav-item:hover i, .nav-item.active i {
            color: #ff8fa3;
            text-shadow: 0 0 8px rgba(255, 143, 163, 0.6);
        }

        /* Main Workspace Section */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1;
            min-width: 0; 
        }

        /* Top Bar Container */
        header {
            background-color: rgba(74, 30, 38, 0.95);
            border: 2px solid #b86271;
            border-radius: 20px;
            padding: 15px 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        /* Ticker Container Layout */
        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            background-color: #3d141a;
            padding: 8px 0;
            border-radius: 10px;
            border: 1px solid #853744;
        }

        .ticker {
            display: inline-block;
            white-space: nowrap;
            will-change: transform;
            transform: translate3d(0, 0, 0);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: geometricPrecision;
        }

        .ticker span {
            display: inline-block;
            padding-right: 100px; 
            color: #ffccd5;
            font-size: 14px;
            font-weight: 500;
        }

        /* Sub-Header Title */
        .header-title {
            color: #ffccd5;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 117, 143, 0.6);
            margin-top: 2px;
            margin-bottom: -4px;
        }

        /* RESTORED: Meta Row for Datetime & Buttons */
        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .datetime {
            font-size: 14px;
            font-weight: bold;
            color: #ffccd5;
            background-color: #3d141a;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #853744;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .square-btn {
            width: 44px;
            height: 44px;
            background-color: #3d141a;
            border: 1px solid #b86271;
            border-radius: 10px;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            color: #ffccd5;
            font-size: 1.1rem;
        }

        .square-btn:hover {
            border-color: #ff8fa3;
            color: #ff8fa3;
            transform: translateY(-2px);
            box-shadow: 0 0 12px rgba(255, 143, 163, 0.4);
        }

        /* Central Layout Display Panel Box */
        .content-body {
            flex: 1;
            background-color: rgba(74, 30, 38, 0.95);
            border: 2px solid #b86271;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            padding: 40px;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            position: relative;
        }

        /* Glow Pink Title */
        .content-body h1 {
            font-size: 6rem;
            color: #fff;
            font-weight: 700;
            text-shadow: 
                0 0 10px #ff4d6d,
                0 0 20px #ff4d6d,
                0 0 40px #ff758f,
                0 0 80px #ff758f;
            letter-spacing: 2px;
            margin-top: 10px;
            margin-left: 15px;
        }
    </style>
</head>
<body>

    <!-- Left Navigation Sidebar -->
    <aside>
        <a href="#" class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>

        <a href="#" class="nav-item">
            <i class="fa-solid fa-gamepad"></i>
            <span>Games</span>
        </a>

        <a href="#" class="nav-item">
            <i class="fa-solid fa-film"></i>
            <span>Movies</span>
        </a>

        <a href="#" class="nav-item">
            <i class="fa-solid fa-comments"></i>
            <span>Chatroom</span>
        </a>

        <a href="#" class="nav-item">
            <i class="fa-solid fa-user-astronaut"></i>
            <span>Creators</span>
        </a>
    </aside>

    <!-- Main Content Container Area -->
    <main>

        <!-- Top Header Area -->
        <header>
            <!-- Scrolling Text Announcement Bar -->
            <div class="ticker-wrap">
                <div class="ticker" id="marqueeTicker">
                    <span>🌸 Welcome to the Comic Relief Corner! Here you can play games, watch movies, or just hang out in the chat room!!🌸</span>
                </div>
            </div>

            <!-- Branding Subtitle -->
            <div class="header-title">
                The Comic Relief Corner
            </div>

            <!-- RESTORED: Meta Row with Date and 4 Actions -->
            <div class="meta-row">
                <div class="datetime" id="liveClock">Loading Date & Time...</div>
                <div class="button-group">
                    <button class="square-btn" title="Settings"><i class="fa-solid fa-gear"></i></button>
                    <button class="square-btn" title="Notifications"><i class="fa-solid fa-bell"></i></button>
                    <button class="square-btn" title="Profile"><i class="fa-solid fa-user"></i></button>
                    <button class="square-btn" title="Help"><i class="fa-solid fa-question"></i></button>
                </div>
            </div>
        </header>

        <!-- Central Display Panel -->
        <div class="content-body">
            <h1>Home</h1>
        </div>

    </main>

    <!-- Seamless Infinite Loop & Clock Engine Script -->
    <script>
        // --- LOOP ENGINE ---
        const ticker = document.getElementById('marqueeTicker');
        const originalSpan = ticker.querySelector('span');
        
        const gapSpace = 100; 
        let totalWidth = originalSpan.getBoundingClientRect().width + gapSpace;
        
        while (totalWidth < window.innerWidth * 2) {
            const clone = originalSpan.cloneNode(true);
            ticker.appendChild(clone);
            totalWidth += originalSpan.getBoundingClientRect().width + gapSpace;
        }

        let currentPosition = 0;
        const speed = 2.5; 

        function animate() {
            const singleBlockWidth = originalSpan.getBoundingClientRect().width + gapSpace;
            currentPosition -= speed;

            if (Math.abs(currentPosition) >= singleBlockWidth) {

currentPosition += singleBlockWidth;
}
ticker.style.transform = translate3d(${currentPosition}px, 0, 0);
requestAnimationFrame(animate);
}
// --- LIVE CLOCK ENGINE ---
function updateClock() {
const now = new Date();
const options = {
weekday: 'short',
year: 'numeric',
month: 'short',
day: 'numeric',
hour: '2-digit',
minute: '2-digit',
second: '2-digit'
};
document.getElementById('liveClock').textContent = now.toLocaleDateString('en-US', options);
}
setInterval(updateClock, 1000);
updateClock(); // Run immediately
// Initialize animation loops securely on resource resolution
window.addEventListener('load', () => {
requestAnimationFrame(animate);
});
