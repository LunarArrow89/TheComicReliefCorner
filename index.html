<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Comic Relief Corner - Home</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* BACKGROUND (UNCHANGED) */
        body {
            display: flex;
            height: 100vh;
            background-color: #303030;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.4) 1px, transparent 1px);
            background-size: 24px 24px;
            padding: 15px;
            gap: 15px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            opacity: 0.20;
            mix-blend-mode: multiply;
        }

        /* SIDEBAR (UNCHANGED) */
        aside {
            width: 260px;
            min-width: 260px;
            flex-shrink: 0;
            background-color: rgba(74, 30, 38, 0.95);
            border: 2px solid #b86271;
            border-radius: 20px;
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            z-index: 11;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 18px;
            text-decoration: none;
            color: #ffccd5;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            white-space: nowrap;
            position: relative;
            overflow: hidden;

            /* ⭐ ONLY CHANGE (requested) */
            background: transparent;
        }

        /* IMAGE BACKGROUNDS (UNCHANGED) */
        .nav-item::before {
            content: "";
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.35;
            z-index: 0;
        }

        .home::before {
            background-image: url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800");
        }

        .games::before {
            background-image: url("https://images.unsplash.com/photo-1552820728-8b83bb6b773f?auto=format&fit=crop&w=800");
        }

        .movies::before {
            background-image: url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=800");
        }

        .chat::before {
            background-image: url("https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=800");
        }

        .creators::before {
            background-image: url("https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=800");
        }

        /* KEEP TEXT ABOVE IMAGES (UNCHANGED) */
        .nav-item i,
        .nav-item span {
            position: relative;
            z-index: 2;
        }

        /* HOVER (UNCHANGED) */
        .nav-item:hover,
        .nav-item.active {
            background-color: rgba(255, 182, 193, 0.2);
            border-color: #ff8fa3;
            transform: translateX(5px);
        }

        .nav-item:hover i,
        .nav-item.active i {
            color: #ff8fa3;
            text-shadow: 0 0 8px rgba(255, 143, 163, 0.6);
        }

        /* ICONS (UNCHANGED) */
        .nav-item i {
            font-size: 1.35rem;
            width: 24px;
            text-align: center;
            color: #b86271;
        }

        /* MAIN LAYOUT (UNCHANGED) */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1;
        }

        header {
            background-color: rgba(74, 30, 38, 0.95);
            border: 2px solid #b86271;
            border-radius: 20px;
            padding: 15px 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ticker-wrap {
            overflow: hidden;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .square-btn {
            width: 44px;
            height: 44px;
            background-color: #3d141a;
            border: 1px solid #b86271;
            border-radius: 10px;
            cursor: pointer;
        }

        .content-body {
            flex: 1;
            background-color: rgba(74, 30, 38, 0.95);
            border: 2px solid #b86271;
            border-radius: 20px;
            padding: 40px;
        }

        .content-body h1 {
            font-size: 6rem;
            color: #fff;
            text-shadow:
                0 0 10px #ff4d6d,
                0 0 20px #ff4d6d,
                0 0 40px #ff758f;
        }

        .datetime {
            color: #ffccd5;
            font-weight: bold;
        }
    </style>
</head>

<body>

<aside>
    <a href="#" class="nav-item home active">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
    </a>

    <a href="#" class="nav-item games">
        <i class="fa-solid fa-gamepad"></i>
        <span>Games</span>
    </a>

    <a href="#" class="nav-item movies">
        <i class="fa-solid fa-film"></i>
        <span>Movies</span>
    </a>

    <a href="#" class="nav-item chat">
        <i class="fa-solid fa-comments"></i>
        <span>Chatroom</span>
    </a>

    <a href="#" class="nav-item creators">
        <i class="fa-solid fa-user-astronaut"></i>
        <span>Creators</span>
    </a>
</aside>

<main>

<header>

    <div class="ticker-wrap">
        <div class="ticker">
            <span>🌸 Welcome to the Comic Relief Corner!</span>
        </div>
    </div>

    <div class="datetime" id="liveClock"></div>

    <div class="button-group">
        <button class="square-btn"><i class="fa-solid fa-gear"></i></button>
        <button class="square-btn"><i class="fa-solid fa-bell"></i></button>
    </div>

</header>

<div class="content-body">
    <h1>Home</h1>
</div>

</main>

<script>
function updateClock() {
    const now = new Date();
    document.getElementById("liveClock").textContent =
        now.toLocaleString();
}
setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
