      const titleElement = document.getElementById("dynamic-title");
      const playerHost = document.getElementById("shadow-player-host"); 
      const closeBtn = document.getElementById("close-modal-btn");
      const movieLinks = document.querySelectorAll(".watch-now-btn, .poster-card");
      
      // Initialize an isolated open shadow root domain inside your structural element block
      const shadowContainer = playerHost.attachShadow({ mode: 'open' });
      
      movieLinks.forEach(link => {
        link.addEventListener("click", function(e) {
          e.preventDefault(); 
          const hrefAttr = this.getAttribute("href");
          
          if (hrefAttr && hrefAttr.includes("watch.html")) {
            const urlData = new URLSearchParams(hrefAttr.substring(hrefAttr.indexOf('?')));
            const movieTitle = urlData.get('title');
            let movieFileUrl = urlData.get('file');
            
            if (movieTitle) {
              titleElement.innerText = "Now Playing: " + movieTitle;
            }
            
            if (movieFileUrl && movieFileUrl !== "PASTE_LINK_HERE") {
              // Extract unique URL parameters safely
              if (movieFileUrl.includes("archive.org") && !movieFileUrl.includes("/embed/")) {
                let identifier = "";
                if (movieFileUrl.includes("/details/")) {
                  identifier = movieFileUrl.split("/details/")[1].split(/[?#]/)[0];
                } else if (movieFileUrl.includes("/download/")) {
                  identifier = movieFileUrl.split("/download/")[1].split("/")[0];
                } else {
                  identifier = movieFileUrl.split('/').filter(Boolean).pop();
                }
                if (identifier) {
                  movieFileUrl = `https://archive.org{identifier}`;
                }
              }
              
              // FIX: Build an unblocked sandbox-free streaming layout via the Shadow DOM context
              shadowContainer.innerHTML = `
                <iframe src="${movieFileUrl}" 
                        allow="autoplay; fullscreen; encrypted-media; picture-in-picture" 
                        allowfullscreen 
                        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; background: #000;">
                </iframe>
              `;
            } else {
              titleElement.innerText = "No video link provided.";
              shadowContainer.innerHTML = "";
            }
            
            modal.style.display = "flex";
            document.body.style.overflow = "hidden"; 
          }
        });
      });
      
      function closeModalWindow() {
        modal.style.display = "none";
        document.body.style.overflow = "auto"; 
        shadowContainer.innerHTML = ""; // Clear active browser stream cache instantly
      }
      
      closeBtn.addEventListener("click", closeModalWindow);
      modal.addEventListener("click", function(e) {
        if (e.target === modal) {
          closeModalWindow();
        }
      });
    });
  </script>
