<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Comic Relief Corner - Movies</title>
  <link rel="stylesheet" href="style.css?v=unified_spacing">
  <script defer src="load.js"></script>
</head>
<body>
  <!-- SIDEBAR-->
  <div id="sidebar-container"></div>
  <!-- HEADER-->
  <div id="header-container"></div>
  
  <div class="main">
    <div class="hero">
      <h1>Movies</h1>
      <p>Grab your popcorn!</p>
    </div>
    
    <!-- FEATURED WIDESCREEN CINEMA BOX -->
    <div class="featured-theater-block">
      <div class="theater-display-screen">
        <img src="coraline.jpeg" alt="Now Screening Feature" class="theater-img">
      </div>
      <div class="theater-display-details">
        <span class="trending-badge">Host's Favorite</span>
        <h2>Coraline</h2>
        <p>Coraline is a masterfully-made claymation film about being careful what you wish for.</p>
        <!-- Encoded target endpoints completely stripped of visible movie stream keywords -->
        <button data-title="Coraline" data-token="aHR0cHM6Ly9hcmNoaXZlLm9yZy9lbWJlZC9jb3JhbGluZS0yMDA5XzIwMjMwMg==" class="watch-now-btn unblocked-trigger-node" style="border:none; cursor:pointer;">Watch now</button>
      </div>
    </div>
    
    <!-- SEARCH & MOVIE CATEGORY BAR -->
    <div class="theater-filter-bar">
      <input type="text" placeholder="Search movies..." class="movie-search-input">
      <div class="movie-category-pills">
        <span class="movie-pill active">All</span>
        <span class="movie-pill">Comedy</span>
        <span class="movie-pill">Animation</span>
        <span class="movie-pill">Action</span>
      </div>
    </div>
    
    <!-- AUTOMATED 6-COLUMN POSTER GRID -->
    <div class="movie-poster-grid">
      <!-- CARD 1: BOSS BABY -->
      <div data-title="Boss Baby" data-token="aHR0cHM6Ly9hcmNoaXZlLm9yZy9lbWJlZC90aGUtYm9zcy1iYWJ5LTIwMTc=" class="poster-card unblocked-trigger-node" style="cursor:pointer;">
        <img src="bossbaby.jpeg" alt="Boss Baby">
        <div class="poster-info"><h3>Boss Baby</h3></div>
      </div>
      <!-- CARD 2: SONIC 3 -->
      <div data-title="Sonic the Hedgehog 3" data-token="aHR0cHM6Ly9tZWdhLm56L2VtYmVkL0xwNUdGSVRJI0ZXN3dHVm1OY1c0emphN0RsMDV2Mk1BRXRrNTdtVXpGZG44R3J2VFNWZw==" class="poster-card unblocked-trigger-node" style="cursor:pointer;">
        <img src="sonic3.jpeg" alt="Sonic the Hedgehog 3">
        <div class="poster-info"><h3>Sonic the Hedgehog 3</h3></div>
      </div>
      <!-- CARD 3: DUNE PART 1 -->
      <div data-title="Dune Part 1" data-token="aHR0cHM6Ly9hcmNoaXZlLm9yZy9lbWJlZC9kdW5lLi0yMDIxLjEwODBwLi1ibHUtcmF5LngtMjY0Li1hYWMtNS4xLXl0cy4tbXg=" class="poster-card unblocked-trigger-node" style="cursor:pointer;">
        <img src="dune1.jpeg" alt="Dune Part 1">
        <div class="poster-info"><h3>Dune Part 1</h3></div>
      </div>
      <!-- CARD 4: DUNE PART 2 -->
      <div data-title="Dune Part 2" data-token="aHR0cHM6Ly9hcmNoaXZlLm9yZy9lbWJlZC9kdW5lLXBhcnQtdHdvLTIwMjRfMjAyNDA1" class="poster-card unblocked-trigger-node" style="cursor:pointer;">
        <img src="dune2.jpeg" alt="Dune Part 2">
        <div class="poster-info"><h3>Dune Part 2</h3></div>
      </div>
      <!-- CARD 5: FINDING NEMO -->
      <div data-title="Finding Nemo" data-token="aHR0cHM6Ly9hcmNoaXZlLm9yZy9lbWJlZC9maW5kaW5nLW5lbW8tMjAwM18yMDIzMDU=" class="poster-card unblocked-trigger-node" style="cursor:pointer;">
        <img src="findingnemo.jpeg" alt="Finding Nemo">
        <div class="poster-info"><h3>Finding Nemo</h3></div>
      </div>
      <!-- CARD 6: CORALINE -->
      <div data-title="Coraline" data-token="aHR0cHM6Ly9hcmNoaXZlLm9yZy9lbWJlZC9jb3JhbGluZS0yMDA5XzIwMjMwMg==" class="poster-card unblocked-trigger-node" style="cursor:pointer;">
        <img src="swapped.png" alt="Coraline">
        <div class="poster-info"><h3>Coraline</h3></div>
      </div>
    </div>
  </div>
 <!-- DYNAMIC MODAL OVERLAY PLAYER SYSTEM -->
 <div id="movie-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 5, 9, 0.85); backdrop-filter: blur(4px); z-index: 10000; align-items: center; justify-content: center;">
 <!-- Modal Inner Card Content Window Box -->
 <div style="background: #1f121b; border: 1px solid rgba(255, 105, 180, 0.25); border-radius: 20px; padding: 25px; width: 90%; max-width: 850px; position: relative; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);">
 
 <!-- X Close Button -->
 <button id="close-modal-btn" style="position: absolute; top: 15px; left: 20px; background: transparent; border: none; color: #ff69b4; font-size: 2rem; font-weight: bold; cursor: pointer; padding: 0; line-height: 1; z-index: 11000;">✕</button>
 
 <!-- Movie Header Title Block -->
 <div class="hero" style="padding: 0 0 15px 40px;">
 <h1 id="dynamic-title" style="font-size: 24px; text-shadow: 0 0 3px #ff69b4, 0 0 8px rgba(255,105,180,.7); margin: 0;">Loading Video...</h1>
 </div>
 
 <!-- DYNAMIC CLOAKING VIEWPORT CONTAINER -->
 <div class="movie-player-wrapper" style="position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.4);">
 <!-- Keeping sandbox clean with popup parameters to allow MEGA's internal decryption script engines to process -->
 <iframe id="dynamic-player" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox" allow="autoplay; fullscreen" allowfullscreen style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; background: #000;"></iframe>
 </div>
 </div>
 </div>

 <!-- CODE INTERCEPTOR & SRC-DOC CLOAKING SCRIPT -->
 <script>
 document.addEventListener("DOMContentLoaded", function() {
 const modal = document.getElementById("movie-modal");
 const titleElement = document.getElementById("dynamic-title");
 const player = document.getElementById("dynamic-player"); 
 const closeBtn = document.getElementById("close-modal-btn");
 
 const movieLinks = document.querySelectorAll(".watch-now-btn, .poster-card");
 movieLinks.forEach(link => {
 link.addEventListener("click", function(e) {
 e.preventDefault(); 
 const hrefAttr = this.getAttribute("href");
 if (hrefAttr && hrefAttr.includes("watch.html")) {
 const urlData = new URLSearchParams(hrefAttr.substring(hrefAttr.indexOf('?')));
 const movieTitle = urlData.get('title');
 let movieFileUrl = urlData.get('file');
 
 if (movieTitle) {
 titleElement.innerText = "Now Playing: " + movieTitle;
 }
 
 if (movieFileUrl && movieFileUrl !== "PASTE_LINK_HERE") {
 // CASE 1: ARCHIVE.ORG HANDLING
 if (movieFileUrl.includes("archive.org")) {
 let identifier = "";
 if (movieFileUrl.includes("/details/")) {
 identifier = movieFileUrl.split("/details/")[1].split(/[?#]/)[0];
 } else if (movieFileUrl.includes("/download/")) {
 identifier = movieFileUrl.split("/download/")[1].split("/")[0];
 } else if (movieFileUrl.includes("/embed/")) {
 identifier = movieFileUrl.split("/embed/")[1].split(/[?#]/)[0];
 } else {
 identifier = movieFileUrl.split('/').filter(Boolean).pop();
 }
 
 if (identifier) {
 player.removeAttribute("src"); 
 const cloakedHTML = `
 <!DOCTYPE html>
 <html>
 <body style="margin:0; padding:0; background:#000; overflow:hidden;">
 <iframe src="https://archive.org{identifier}" width="100%" height="100%" frameborder="0" webkitallowfullscreen="true" mozallowfullscreen="true" allowfullscreen style="position:absolute; top:0; left:0; width:100%; height:100%; border:none;"></iframe>
 </body>
 </html>`;
 player.srcdoc = cloakedHTML; 
 }
 // CASE 2: MEGA.NZ INTERCEPTOR ENGINE
 } else if (movieFileUrl.includes("mega.nz")) {
 player.removeAttribute("src");
 // Auto-correct layout addresses just in case a raw /file/ link is passed
 let correctMegaUrl = movieFileUrl.replace("/file/", "/embed/");
 const cloakedMegaHTML = `
 <!DOCTYPE html>
 <html>
 <body style="margin:0; padding:0; background:#000; overflow:hidden;">
 <iframe src="${correctMegaUrl}" width="100%" height="100%" frameborder="0" allowfullscreen style="position:absolute; top:0; left:0; width:100%; height:100%; border:none;"></iframe>
 </body>
 </html>`;
 player.srcdoc = cloakedMegaHTML;
 // CASE 3: FALLBACK RUNTIME TRACKS
 } else {
 player.removeAttribute("srcdoc");
 player.src = movieFileUrl;
 }
 } else {
 titleElement.innerText = "No video link provided.";
 }
 modal.style.display = "flex";
 document.body.style.overflow = "hidden"; 
 }
 });
 });

 function closeModalWindow() {
 modal.style.display = "none";
 document.body.style.overflow = "auto"; 
 player.removeAttribute("srcdoc"); 
 player.src = ""; 
 }
 
 closeBtn.addEventListener("click", closeModalWindow);
 modal.addEventListener("click", function(e) {
 if (e.target === modal) {
 closeModalWindow();
 }
 });
 });
 </script>
</body>
</html>
