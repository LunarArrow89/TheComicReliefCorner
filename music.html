<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creators</title>
<style>
  /* Global page resetting overrides */
  * {
    box-sizing: border-box;
  }
  
  body {
    background-color: #ffffff;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #000000;
    display: flex;
    min-height: 100vh;
  }

  /* Structural UI Mockup Wireframe Layout */
  .sidebar-container {
    width: 200px;
    border-right: 3px solid #000000;
    padding: 20px;
    font-weight: bold;
    font-size: 18px;
    flex-shrink: 0;
  }

  .main-layout-wrapper {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
  }

  .header-container {
    width: 100%;
    border-bottom: 3px solid #000000;
    padding: 20px 40px;
  }

  .page-title {
    font-size: 32px;
    font-weight: bold;
    margin: 0 0 8px 0;
  }

  .page-subtext {
    font-size: 16px;
    color: #555555;
    margin: 0;
  }

  /* Main Workspace Display Grid */
  .content-view-body {
    padding: 40px;
    display: flex;
    flex-direction: column;
    gap: 25px;
    max-width: 900px;
  }

  /* Rounded Structural Creator Block Modules */
  .creator-card-box {
    border: 2px solid #000000;
    border-radius: 12px;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    background-color: #ffffff;
  }

  /* Media Thumbnail Asset Area Container */
  .media-thumbnail-placeholder {
    width: 100px;
    height: 100px;
    border: 1px solid #000000;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
    color: #444444;
    background-color: #fafafa;
    flex-shrink: 0;
  }

  .profile-data-column {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* Topline Align Structure Group */
  .profile-headline-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 15px;
  }

  .profile-bold-title {
    font-size: 20px;
    font-weight: bold;
    margin: 0;
  }

  .social-buttons-cluster {
    display: flex;
    gap: 8px;
  }

  /* Round Social Control Links with Image Support */
  .social-link-circle {
    width: 32px;
    height: 32px;
    border: 1px solid #000000;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background-color: #ffffff;
    transition: transform 0.1s ease;
  }
  
  .social-link-circle:hover {
    transform: scale(1.05);
  }

  .social-link-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Detail Subtext Layout Properties */
  .profile-subtext {
    font-size: 14px;
    font-style: italic;
    color: #444444;
    margin: 0;
  }

  .profile-small-description {
    font-size: 13px;
    color: #666666;
    margin: 0;
    line-height: 1.4;
  }
</style>
</head>
<body>

  <!-- Structural Navigation Sidebar Layout Frame -->
  <aside class="sidebar-container">
    Sidebar
  </aside>

  <!-- Right Block Window Grid -->
  <div class="main-layout-wrapper">
    
    <!-- Branding Header Frame Element -->
    <header class="header-container">
      <h1 class="page-title">Creators</h1>
      <p class="page-subtext">thanks for our cool peeps!</p>
    </header>

    <!-- Main Dynamic Feed Target Component Container -->
    <main class="content-view-body">
      
      <!-- Creator Block Module #1 -->
      <section class="creator-card-box">
        <div class="media-thumbnail-placeholder">
          Img/gif
        </div>
        <div class="profile-data-column">
          <div class="profile-headline-row">
            <h2 class="profile-bold-title">Bold, title text</h2>
            <div class="social-buttons-cluster">

              <a href="#" class="social-link-circle"><img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 24 24' fill='black'><path d='M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.11.82-.26.82-.577v-2.234c-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22v3.293c0 .319.22.694.825.576C20.565 21.795 24 17.3 24 12c0-6.63-5.37-12-12-12z'/></svg>" alt="Social 2"></a>
              <a href="#" class="social-link-circle"></a>
              <a href="#" class="social-link-circle"></a>
            </div>
          </div>
          <p class="profile-subtext">Subtext position directly beneath title header element</p>
          <p class="profile-small-description">Description small text</p>
        </div>
      </section>

      <!-- Creator Block Module #2 -->
      <section class="creator-card-box">
        <div class="media-thumbnail-placeholder">
          Img/gif
        </div>
        <div class="profile-data-column">
          <div class="profile-headline-row">
            <h2 class="profile-bold-title">Bold, title text</h2>
            <div class="social-buttons-cluster">
              <a href="#" class="social-link-circle"></a>
              <a href="#" class="social-link-circle"></a>
              <a href="#" class="social-link-circle"></a>
              <a href="#" class="social-link-circle"></a>
            </div>
          </div>
          <p class="profile-subtext">Subtext position directly beneath title header element</p>
          <p class="profile-small-description">Description small text</p>
        </div>
      </section>

    </main>
  </div>

</body>
</html>
