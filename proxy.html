<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <!-- Links your main stylesheet to inherit the background gradient, fonts, and layouts -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Dedicated workspace area that respects the 220px sidebar and 80px header bounds */
        .page-content-workspace {
            position: fixed;
            top: 80px;
            left: 220px;
            width: calc(100% - 220px);
            height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-sizing: border-box;
            z-index: 10;
        }

        /* The exact white container card window box from your layout reference */
        .construction-card {
            background-color: #ffffff;
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            padding: 55px 45px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            font-family: 'Segoe UI', Arial, sans-serif;
            box-sizing: border-box;
            text-align: left;
        }

        /* Title heading styling inside the white card */
        .construction-card h1 {
            color: #000000;
            font-size: 32px;
            font-weight: 800;
            margin: 0 0 35px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        /* Call to action subtext description lines */
        .construction-card p {
            color: #000000;
            font-size: 24px;
            font-weight: 700;
            line-height: 1.4;
            margin: 0;
        }

        /* Layout fallback breakpoints matching your system sheet configurations */
        @media (max-width: 768px) {
            .page-content-workspace {
                position: relative;
                top: 0;
                left: 0;
                width: 100%;
                height: auto;
                min-height: calc(100vh - 160px);
                padding: 20px;
            }
            .construction-card {
                padding: 35px 25px;
            }
            .construction-card h1 {
                font-size: 24px;
                margin-bottom: 25px;
            }
            .construction-card p {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <!-- 1. Restored Master Navigation Sidebar Module Panel Target Shell -->
    <div id="sidebar-container">
        <object type="text/html" data="sidebar.html" style="width: 100%; height: 100%; border: none;"></object>
    </div>

    <!-- 2. Restored Master Upper Display Header Banner Target Shell -->
    <div id="header-container">
        <object type="text/html" data="header.html" style="width: 100%; height: 100%; border: none;"></object>
    </div>

    <!-- 3. Balanced Application Content Presentation Workspace Frame -->
    <main class="page-content-workspace">
        
        <!-- Replicated Under Construction Notice Graphic Card -->
        <div class="construction-card">
            <h1>Under Construction 🚧</h1>
            <p>Donate to speed up the development of this page</p>
        </div>

    </main>

</body>
</html>
