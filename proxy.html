<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <!-- Links your main stylesheet to inherit the deep dark background theme -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Fullscreen wrapper to center the card on the entire screen */
        .fullscreen-center-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 9999;
        }

        /* The exact white content container window box from your screenshot */
        .construction-card {
            background-color: #ffffff;
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            padding: 55px 45px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            font-family: 'Segoe UI', Arial, sans-serif;
            box-sizing: border-box;
            text-align: left;
        }

        /* Title heading styling */
        .construction-card h1 {
            color: #000000;
            font-size: 32px;
            font-weight: 800;
            margin: 0 0 35px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        /* Call to action subtext styling */
        .construction-card p {
            color: #000000;
            font-size: 24px;
            font-weight: 700;
            line-height: 1.4;
            margin: 0;
        }

        /* Mobile layout scaling adjustments */
        @media (max-width: 480px) {
            .construction-card {
                padding: 35px 25px;
            }
            .construction-card h1 {
                font-size: 24px;
                margin-bottom: 25px;
            }
            .construction-card p {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <!-- Center layout container filling the whole viewport -->
    <div class="fullscreen-center-wrapper">
        
        <!-- Replicated construction notice window card -->
        <div class="construction-card">
            <h1>Under Construction 🚧</h1>
            <p>Donate to speed up the development of this page</p>
        </div>

    </div>

</body>
</html>
