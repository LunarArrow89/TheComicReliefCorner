  <!-- LOGO IMAGE -->
  <div class="logo-container"> 
    <!-- Monthly logo ring -->
    <img src="logo-ring.png" alt="Logo Ring" class="logo-ring">
    <!-- Monthly logo; June uses the normal logo with a rainbow Pride overlay -->
    <span class="monthly-logo-wrap" id="monthly-logo-wrap">
      <img src="logo-october.png" alt="The Comic Relief Corner" class="logo-image" id="monthly-logo"
        >
    </span>
  </div> 

  <!-- HOME BUTTON --> 
  <a href="home.html" class="nav-btn"> 
    <img src="home-icon.png" alt="Home" class="nav-icon-img"> Home 
  </a> 

  <!-- GAMES BUTTON --> 
  <a href="games.html" class="nav-btn"> 
    <img src="games-icon.png" alt="Games" class="nav-icon-img"> Games 
  </a> 

  <!-- MUSIC BUTTON --> 
  <a href="music.html" class="nav-btn"> 
    <img src="music-icon.png" alt="Music" class="nav-icon-img"> Music 
  </a> 

  <!-- CREATORS BUTTON --> 
  <a href="creators.html" class="nav-btn"> 
    <img src="creators-icon.png" alt="Creators" class="nav-icon-img"> Creators 
  </a> 

  <!-- CHATROOM BUTTON --> 
  <a href="proxy.html" class="nav-btn">

    <img src="proxy-icon.png" alt="Proxy" class="nav-icon-img"> Proxy 
  </a> 
</div>

<script>
(function () {
  // This file is also embedded directly by proxy.html and
  // under-construction.html using an <object>. In that case load.js
  // in the parent page cannot attach click handlers to this document.
  const logos = [
    "logo-january-november.png", "logo-febuary.png",
    "logo-march-june-july-september.png", "logo-april.png",
    "logo.png", "logo.png",
    "logo-march-june-july-september.png", "logo.png",
    "logo-march-june-july-september.png", "logo-october.png",
    "logo-january-november.png", "logo.png"
  ];

  function initSidebarSettings() {
    const toggle = document.getElementById("monthly-settings-toggle");
    const panel = document.getElementById("monthly-settings-panel");
    const select = document.getElementById("monthly-month-select");
    const apply = document.getElementById("monthly-month-apply");
    const reset = document.getElementById("monthly-month-reset");
    const close = document.getElementById("monthly-settings-close");
    const logo = document.getElementById("monthly-logo");
    const wrap = document.getElementById("monthly-logo-wrap");
    if (!toggle || !panel || !select || !apply || !reset || !logo) return;

    // Put the overlay at document level so the sidebar's scrolling container cannot clip it.
    if (panel.parentElement !== document.body) document.body.appendChild(panel);

    function applyMonth(month) {
      logo.src = new URL(logos[month], document.baseURI).href;
      if (wrap) {
        wrap.classList.toggle("pride-june", month === 5);
        wrap.classList.toggle("october-logo", month === 9);
        wrap.classList.toggle("february-logo", month === 1);
      }
      // Force February's artwork smaller inline so competing CSS cannot cancel the change.
      logo.style.setProperty("transform", month === 1 ? "scale(0.38)" : (month === 9 ? "scale(0.72)" : ""), month === 1 || month === 9 ? "important" : "");
    }

    const saved = localStorage.getItem("comicReliefLogoMonth");
    const current = saved !== null && saved !== "auto" && Number(saved) >= 0 && Number(saved) <= 11
      ? Number(saved) : new Date().getMonth();
    select.value = String(current);
    applyMonth(current);

    function closeSettings() {
      panel.hidden = true;
      toggle.setAttribute("aria-expanded", "false");
    }

    toggle.addEventListener("click", function (event) {
      event.preventDefault();
      const opening = panel.hidden;
      panel.hidden = !opening;
      toggle.setAttribute("aria-expanded", String(opening));
    });

    if (close) close.addEventListener("click", closeSettings);
    panel.addEventListener("click", function (event) {
      if (event.target === panel) closeSettings();
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && !panel.hidden) closeSettings();
    });

    apply.addEventListener("click", function (event) {
      event.preventDefault();
      const month = Number(select.value);
      if (!Number.isInteger(month) || month < 0 || month > 11) return;
      localStorage.setItem("comicReliefLogoMonth", String(month));
      applyMonth(month);
      const note = panel.querySelector(".settings-note");
      if (note) note.textContent = "Saved! The logo will use " + select.options[select.selectedIndex].text + " on this browser.";
    });

    reset.addEventListener("click", function (event) {
      event.preventDefault();
      localStorage.setItem("comicReliefLogoMonth", "auto");
      const month = new Date().getMonth();
      select.value = String(month);
      applyMonth(month);
      const note = panel.querySelector(".settings-note");
      if (note) note.textContent = "Using the current calendar month automatically.";
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initSidebarSettings);
  } else {
    initSidebarSettings();
  }
})();
</script>
