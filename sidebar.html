  <div class="logo-container">

    <img src="logo-ring.png" alt="Logo Ring" class="logo-ring">
    <!-- Automatically selects the logo for the current month -->
    <img src="logo-october.png" alt="The Comic Relief Corner" class="logo-image" id="monthly-logo"
       onload="if (!this.dataset.monthlyLogoInitialized) { this.dataset.monthlyLogoInitialized = 'true'; const monthlyLogos = {0:'logo-january-november.png',1:'logo-febuary.png',2:'logo-march-june-july-september.png',3:'logo-april.png',4:'logo-may.png',5:'logo-march-june-july-september.png',6:'logo-march-june-july-september.png',8:'logo-march-june-july-september.png',9:'logo-october.png',10:'logo-january-november.png'}; this.src = monthlyLogos[new Date().getMonth()] || 'logo.png'; }">
  </div> 

  <!-- HOME BUTTON --> 
  <a href="home.html" class="nav-btn"> 
    <img src="home-icon.png" alt="Home" class="nav-icon-img"> Home 
  </a> 

  <!-- GAMES BUTTON --> 
  <a href="games.html" class="nav-btn"> 
    <img src="games-icon.png" alt="Games" class="nav-icon-img"> Games

  </a> 
</div>

<script>
  (function () {
    const monthlyLogo = document.getElementById("monthly-logo");
    if (!monthlyLogo) return;

    // These filenames match the monthly logo assets in this repository.
    const monthlyLogos = {
      0: "logo-january-november.png",
      1: "logo-febuary.png",
      2: "logo-march-june-july-september.png",
      3: "logo-april.png",
      4: "logo-may.png",
      5: "logo-march-june-july-september.png",
      6: "logo-march-june-july-september.png",
      8: "logo-march-june-july-september.png",
      9: "logo-october.png",
      10: "logo-january-november.png"
    };

    function updateMonthlyLogo() {
      const month = new Date().getMonth();
      const nextLogo = monthlyLogos[month] || "logo.png";
      if (!monthlyLogo.src.endsWith("/" + nextLogo)) {
        monthlyLogo.src = nextLogo;
      }
    }

    updateMonthlyLogo();
    // Also catches a month change while the page remains open.
    setInterval(updateMonthlyLogo, 60 * 1000);
    document.addEventListener("visibilitychange", updateMonthlyLogo);
  })();
</script>
